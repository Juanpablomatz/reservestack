
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>ROSA MEXICANO</h2></div>
            <nav class="main-nav">
                <a href="#" class="nav-link active" data-vista="plano"><i class="fas fa-map-marker-alt"></i> Plano</a>
                <a href="#" class="nav-link" data-vista="analitica"><i class="fas fa-chart-line"></i> Analítica</a>
            </nav>
            
            <div class="sidebar-content-wrapper">
                <div id="vista-lista-sidebar">
                    <div class="section-header">
                        <h3>Reservas Activas</h3>
                        <button id="nueva-reserva-btn" class="btn-small"><i class="fas fa-plus"></i></button>
                    </div>

                    <div class="search-sidebar-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="input-buscador" placeholder="Buscar cliente o mesa..." autocomplete="off">
                    </div>
                    <div id="lista-reservas-sidebar" class="lista-reservas-sidebar"></div>
                </div>
            </div>

            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);">
                <button id="btn-logout" class="btn-accion-detalle btn-matar" style="width:100%">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div id="aviso-mover" class="aviso-modo-mover oculto">
                <span><i class="fas fa-exchange-alt"></i> Elige mesa libre</span>
                <button id="btn-cancelar-mover" class="btn-cancelar-mover">Cancelar</button>
            </div>

            <div id="vista-plano" class="vista">
                <div class="main-header">
                    <div class="header-left">
                        <h1>Plano</h1>
                        <input type="date" id="filtro-fecha-global" class="input-fecha-header">
                    </div>
                    
                    <div class="zonas-nav">
                        <button data-zona="cava" class="zona-btn active">Cava</button>
                        <button data-zona="jardin" class="zona-btn">Jardín</button>
                        <button data-zona="terraza" class="zona-btn">Terraza</button>
                        <button data-zona="piso" class="zona-btn">Piso</button>
                    </div>
                </div>
                
                <div class="stats-container">
                    <div class="stat-card"><i class="fas fa-users"></i><div class="stat-info"><span id="stats-ocupadas">0</span><label>Ocupadas</label></div></div>
                    <div class="stat-card"><i class="fas fa-calendar-check"></i><div class="stat-info"><span id="stats-reservadas">0</span><label>Reservadas</label></div></div>
                    <div class="stat-card"><i class="fas fa-door-open"></i><div class="stat-info"><span id="stats-libres">0</span><label>Libres</label></div></div>
                    <div class="stat-card"><i class="fas fa-lock"></i><div class="stat-info"><span id="stats-bloqueadas">0</span><label>Bloqueadas</label></div></div>
                    <div class="stat-card"><i class="fas fa-user-friends"></i><div class="stat-info"><span id="stats-pax-total">0</span><label>Pax Total</label></div></div>
                    <div class="stat-card"><i class="fas fa-chart-pie"></i><div class="stat-info"><span id="stats-porcentaje-ocupacion">0%</span><label>% Ocupación</label></div></div>
                </div>

                <div id="plano-restaurante" class="plano-restaurante"></div>
            </div>

            <div id="vista-analitica" class="vista oculto">
                <div class="main-header"><h1>Reporte</h1></div>
                <div class="analytics-grid">
                    <div class="analytics-card big-card">
                        <div class="card-header-flex">
                            <h3>Rendimiento</h3>
                            <button id="btn-toggle-chart" class="btn-small"><i class="fas fa-sync-alt"></i></button>
                        </div>
                        <div id="grafica-zonas"></div>
                    </div>
                    <div class="analytics-card">
                        <h3>Métricas</h3>
                        <div class="metric-item"><span>Pax Promedio</span><strong id="data-avg-pax">0</strong></div>
                        <div class="metric-item"><span>Mesas Atendidas</span><strong id="data-total-reservas">0</strong></div>
                        <div class="metric-item"><span>Tiempo Promedio</span><strong id="data-avg-time" style="color:var(--info)">-- min</strong></div>
                        <div class="metric-item"><span>Hora Pico</span><strong id="data-peak-hour" style="color:var(--edit)">--:00</strong></div>
                        <div class="metric-item"><span>Zona Top</span><strong id="data-top-zone" style="color:var(--accent)">--</strong></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="menu-mesa" class="menu-contextual oculto">
        <button data-accion="nueva-reserva-mesa" class="menu-opcion"><i class="fas fa-plus"></i> Nueva Reserva</button>
        <button data-accion="walk-in" class="menu-opcion"><i class="fas fa-walking"></i> Walk-in</button>
        <button data-accion="bloquear" class="menu-opcion"><i class="fas fa-lock"></i> Bloquear</button>
        <button data-accion="marcar-llegada" class="menu-opcion"><i class="fas fa-check"></i> Marcar Llegada</button>
        <button data-accion="mover-mesa" class="menu-opcion"><i class="fas fa-exchange-alt"></i> Mover Mesa</button>
        <button data-accion="liberar-mesa" class="menu-opcion"><i class="fas fa-check-double"></i> Liberar</button>
        <button data-accion="cancelar-reserva" class="menu-opcion"><i class="fas fa-trash-alt"></i> Cancelar</button>
        <button data-accion="desbloquear" class="menu-opcion"><i class="fas fa-unlock"></i> Desbloquear</button>
    </div>

    <div id="modal-nueva-reserva" class="modal-overlay oculto"></div>

    <div id="modal-mover-reserva" class="modal-overlay oculto">
        <div class="modal-content">
            <div class="modal-header"><h2>Mover Reserva</h2><button id="mover-close-btn" class="modal-close-btn">&times;</button></div>
            <div class="modal-body">
                <p>Mover a <strong id="mover-nombre-cliente"></strong>:</p>
                <form id="form-mover-reserva">
                    <input type="hidden" id="mover-id-reserva">
                    <div class="form-row"><div class="form-group"><label>Zona</label><select id="mover-zona" required></select></div><div class="form-group"><label>Mesa</label><select id="mover-mesa" required></select></div></div>
                    <div class="modal-footer"><button type="submit" class="btn-primary" style="background-color:var(--move); color: white;">MOVER</button></div>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-detalle-reserva" class="modal-overlay oculto">
        <div class="modal-content">
            <div class="modal-header"><h2 id="popup-nombre">Detalle</h2><button id="popup-close-btn" class="modal-close-btn">&times;</button></div>
            <div class="modal-body">
                <div class="detalle-grid">
                    <div class="dato-item"><i class="fas fa-users"></i> <strong id="popup-personas"></strong> pax</div>
                    <div class="dato-item"><i class="fas fa-map-pin"></i> Mesa <strong id="popup-mesa"></strong></div>
                    <div class="dato-item" style="grid-column: span 2;"><i class="far fa-calendar-alt"></i> <strong id="popup-fecha"></strong></div>
                    <div class="dato-item"><i class="fas fa-map"></i> <span id="popup-zona"></span></div>
                    <div class="dato-item"><i class="fas fa-info-circle"></i> <span id="popup-status" class="badge"></span></div>
                </div>
                <hr>
                <div class="contacto-info"><p><i class="fas fa-phone"></i> <span id="popup-tel"></span></p><p><i class="fas fa-envelope"></i> <span id="popup-email"></span></p></div>
                <div class="nota-box"><small>Notas:</small><p id="popup-nota"></p></div>
                <div id="popup-acciones" class="modal-footer-acciones"></div>
            </div>
        </div>
    </div>
    
    <div id="modal-lista-mesa" class="modal-overlay oculto">
        <div class="modal-content">
            <div class="modal-header"><h2>Múltiples Reservas</h2><button id="lista-mesa-close-btn" class="modal-close-btn">&times;</button></div>
            <div class="modal-body">
                <p style="color:#aaa;">Selecciona una reserva:</p>
                <div id="lista-conflictos" class="lista-conflictos"></div>
            </div>
        </div>
    </div>
