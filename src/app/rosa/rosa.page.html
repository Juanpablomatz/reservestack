<div class="dashboard-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2 style="color: #e84393; font-family: serif; margin: 0;">ROSA MEXICANO</h2>
            <small style="color: #aaa;">Panel de Hostess</small>
        </div>
        
        <nav class="main-nav">
            <a href="#" class="nav-link active" data-vista="plano"><i class="fas fa-map-marker-alt"></i> Plano</a>

    <main class="main-content">
