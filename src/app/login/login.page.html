<ion-content class="fondo-pantalla">
  <div class="contenedor-centrado">
    <ion-card class="tarjeta-oscura">
      <ion-card-header>
        <ion-card-title class="titulo">ACCESO<br>CORPORATIVO</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="form-group">
          <ion-input type="text" placeholder="Usuario Maestro" class="input-item" [(ngModel)]="usuario"></ion-input>
          <ion-input type="password" placeholder="Contraseña" class="input-item" [(ngModel)]="password"></ion-input>
        </div>

        <!-- Mensaje de error si la contraseña es incorrecta -->
        <p *ngIf="errorMessage" style="color: #ff6b6b; font-size: 12px; margin-top: 15px; font-weight: bold; margin-bottom: 0;">
          {{ errorMessage }}
        </p>

        <ion-button expand="block" class="btn-dorado" (click)="entrarAlSistema()" [disabled]="cargando">
          {{ cargando ? 'VERIFICANDO...' : 'ENTRAR' }}
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
