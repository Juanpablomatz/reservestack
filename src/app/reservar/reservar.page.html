<ion-content class="fondo-pantalla">
  <div class="contenedor-centrado">
    <div class="form-container">
      
      <!-- Logo -->
      <div class="logo-container">
        <img src="assets/imgrosamx.jpg" alt="Logo Rosa Mexicano" class="logo-img">
      </div>
      
      <!-- Cuerpo del formulario -->
      <div class="form-body">
        <h3>Reserva tu Mesa en Rosa Mexicano</h3>
        
        <!-- Fila Fecha y Hora -->
        <div class="row-inputs">
          <div class="column-input">
            <label class="label-texto">Fecha de visita</label>
            <div class="input-wrapper">
              <ion-icon name="calendar-outline" class="icono-input"></ion-icon>
              <ion-input type="date" [min]="todayDate" [(ngModel)]="fecha" class="input-limpio"></ion-input>
            </div>
          </div>
          <div class="column-input">
            <label class="label-texto">Hora</label>
            <div class="input-wrapper">
              <ion-icon name="time-outline" class="icono-input"></ion-icon>
              <ion-input type="time" [(ngModel)]="hora" class="input-limpio"></ion-input>
            </div>
          </div>
        </div>

        <!-- Personas -->
        <label class="label-texto">Número de Personas</label>
        <div class="input-wrapper">
          <ion-icon name="people-outline" class="icono-input"></ion-icon>
          <ion-input type="number" min="1" max="50" [(ngModel)]="personas" placeholder="Ej. 4 personas" class="input-limpio"></ion-input>
        </div>
        
        <!-- Área de Preferencia -->
        <label class="label-texto">Área de Preferencia</label>
        <div class="input-wrapper">
          <ion-icon name="restaurant-outline" class="icono-input"></ion-icon>
          <ion-select [(ngModel)]="zona" placeholder="Selecciona el área..." class="input-limpio" interface="popover">
            <ion-select-option *ngFor="let z of zonasDisponibles" [value]="z">{{ z }}</ion-select-option>
          </ion-select>
        </div>

        <hr class="divider">

        <!-- Fila Nombre y Apellido -->
        <div class="row-inputs">
          <div class="column-input">
            <label class="label-texto">Nombre</label>
            <div class="input-wrapper">
              <ion-icon name="person-outline" class="icono-input"></ion-icon>
              <ion-input type="text" [(ngModel)]="nombre" placeholder="Ej. Juan Pablo" class="input-limpio"></ion-input>
            </div>
          </div>
          <div class="column-input">
            <label class="label-texto">Apellido</label>
            <div class="input-wrapper">
              <ion-icon name="person-outline" class="icono-input"></ion-icon>
              <ion-input type="text" [(ngModel)]="apellido" placeholder="Ej. Pérez" class="input-limpio"></ion-input>
            </div>
          </div>
        </div>

        <!-- Teléfono -->
        <label class="label-texto">Número de Teléfono</label>
        <div class="input-wrapper">
          <ion-icon name="call-outline" class="icono-input"></ion-icon>
          <ion-input type="tel" [(ngModel)]="telefono" (ionInput)="limpiarTelefono($event)" placeholder="Ej. 44334534" class="input-limpio"></ion-input>
        </div>

        <!-- Email -->
        <label class="label-texto">Correo Electrónico</label>
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="icono-input"></ion-icon>
          <ion-input type="email" [(ngModel)]="email" placeholder="Ej. Corro@gmail.com" class="input-limpio"></ion-input>
        </div>

        <!-- Notas Especiales -->
        <label class="label-texto">Notas Especiales</label>
        <div class="input-wrapper textarea-wrapper">
          <ion-icon name="document-text-outline" class="icono-input"></ion-icon>
          <ion-textarea [(ngModel)]="nota" placeholder="Ej. Alergias, cumpleaños..." class="input-limpio"></ion-textarea>
        </div>
      </div>
      
      <!-- Botón -->
      <div class="form-footer">
        <ion-button expand="block" class="btn-guardar" (click)="confirmarReservacion()">
          CONFIRMAR RESERVACIÓN
        </ion-button>
      </div>

    </div>
  </div>
</ion-content>
